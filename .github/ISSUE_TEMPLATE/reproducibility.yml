name: Source release reproducibility
description: Report a source archive or release manifest mismatch
title: 'release: '
labels: [bug]
body:
  - type: input
    id: revision
    attributes:
      label: Tag and full commit SHA
    validations:
      required: true
  - type: textarea
    id: comparison
    attributes:
      label: Commands and differing artifacts
      description: Include both SHA-256 values, manifest commit/tree, and whether you compared project-produced archives or GitHub automatic snapshots.
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Environment
      description: OS, architecture, Git, Bash, gzip and checksum tool versions.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data confirmation
      options:
        - label: This report contains no private code, credentials, or evidence.
          required: true
