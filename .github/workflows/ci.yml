name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
      - name: Enforce source-only distribution
        run: grep -Fxq 'publish = false' Cargo.toml
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check internal documentation links
        run: python3 scripts/check-markdown-links.py
      - name: Check workflow permissions and action pins
        run: python3 scripts/check-workflow-policy.py
      - name: Test reproducible source release tooling
        run: scripts/test-source-release.sh

  test-linux:
    name: Full test suite (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minimum supported Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Run full test suite
        run: cargo test --locked --all-targets
      - name: Verify documented commands from a clean checkout
        run: scripts/test-clean-checkout.sh

  portable-provider:
    name: Provider protocol (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minimum supported Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Run library regressions and response conformance
        run: cargo test --locked --lib
      - name: Run CLI help regression tests
        run: cargo test --locked --test cli_help
      - name: Run reference-provider CLI tests (macOS)
        if: runner.os == 'macOS'
        run: cargo test --locked --test provider_cli
      - name: Run native provider process contract
        run: cargo test --locked --test provider_process_portable

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo.lock
        run: cargo audit --deny warnings
      - name: Check dependency licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses
          rust-version: "1.98.0"
