name: Protocol change proposal
description: Propose a change to a versioned ADRProof interchange contract
title: "protocol: "
labels: ["protocol", "design"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the neutral use case and current limitation.
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Authority impact
      description: Explain whether facts, provenance, coverage, or proof authority changes.
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - Compatible clarification or fixture
        - Compatible optional behavior
        - Incompatible new protocol version
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Executable acceptance tests
      description: List the conformance cases that would establish the change.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data confirmation
      options:
        - label: The proposal is neutral and contains no customer-specific material.
          required: true
